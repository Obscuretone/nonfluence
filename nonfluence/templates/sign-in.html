<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Nonfluence</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='sign-in.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('browser_login.sign_in') }}">
      <img src="{{ url_for('static', filename='obscuretone.svg') }}" width="32" height="32" alt="">
      Nonfluence
    </a>
  </header>
  <main>
    <h1>Sign in</h1>
    {% if passkey_url %}
    <a class="passkey" href="{{ passkey_url }}">Sign in with a passkey</a>
    <details{% if error %} open{% endif %}>
      <summary>Use password</summary>
    {% endif %}
    {% if error %}<p id="sign-in-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('browser_login.sign_in') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="160" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" maxlength="512" required>
      <button type="submit">Sign in</button>
    </form>
    {% if passkey_url %}</details>{% endif %}
  </main>
</body>
</html>
