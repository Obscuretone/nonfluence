[project]
name = "nonfluence"
version = "0.1.0"
description = "A local Markdown knowledge base with typed references and scoped MCP"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "markdown-it-py>=4.0,<5",
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
hosting = ["waitress>=3,<4"]
confidential = ["authlib>=1.9.9,<2", "joserfc>=1,<2", "requests>=2.32,<3"]
mariadb = ["PyMySQL==1.2.4"]

[tool.uv]
package = false
