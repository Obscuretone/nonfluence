map $http_authorization $nonfluence_api_realm {
    ""      off;
    default "Nonfluence";
}

map $uri $nonfluence_login_address {
    default  "";
    /login   $binary_remote_addr;
    /login/  $binary_remote_addr;
}

limit_req_zone $nonfluence_login_address zone=nonfluence_login:1m rate=5r/m;

map $http_authorization $nonfluence_basic_address {
    default "";
    ~*^Basic[[:space:]] $binary_remote_addr;
}
limit_req_zone $nonfluence_basic_address zone=nonfluence_api_auth:1m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name docs.obscuretone.com;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/nonfluence/acme;
        try_files $uri =404;
    }

    location / { return 308 https://docs.obscuretone.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.obscuretone.com;

    ssl_certificate /etc/letsencrypt/live/docs.obscuretone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.obscuretone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    client_max_body_size 1221k;
    limit_req zone=nonfluence_login burst=8 nodelay;
    limit_req_status 429;

    location ^~ /api/ {
        limit_req zone=nonfluence_api_auth burst=15 nodelay;
        auth_basic $nonfluence_api_realm;
        auth_basic_user_file /etc/nginx/nonfluence.htpasswd;
        proxy_set_header Host docs.obscuretone.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Nonfluence-Verified-User $remote_user;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://unix:/run/nonfluence/web.sock;
    }

    location / {
        proxy_set_header Host docs.obscuretone.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Nonfluence-Verified-User "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://unix:/run/nonfluence/web.sock;
    }
}
